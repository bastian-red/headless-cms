# The datastores are always on; the application services live behind the `app`
# profile so `docker compose up -d` gives you what `pnpm dev` needs and nothing
# else.
#
#   docker compose -f infra/docker-compose.yml up -d              # postgres + redis
#   docker compose -f infra/docker-compose.yml --profile app up -d --build

# Explicit, and not optional. Without it Compose derives the project name from the
# containing directory, which is `infra` in every project in this portfolio, and
# bringing up a second stack evicts the first one's containers AND its volumes.
name: cms

services:
  postgres:
    image: postgres:16-alpine
    container_name: cms-postgres
    # Back after a Docker daemon restart or a reboot. Without it a restart left
    # pnpm dev retrying a stopped Redis every 2 s until someone noticed.
    restart: unless-stopped
    # A smaller WAL ceiling than the 1 GB default: the search bench (build step
    # 5) writes thousands of revisions, and a full Docker disk crashes the server
    # mid-run (a sibling project learned this). 128 MB only means more frequent
    # checkpoints.
    command: ['postgres', '-c', 'max_wal_size=128MB', '-c', 'min_wal_size=32MB']
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
      POSTGRES_DB: cms
    # 5432 is the dev host's own PostgreSQL and 5433-5443 belong to the sibling
    # portfolio stacks, so this project takes 5444.
    ports:
      - '5444:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cms -d cms']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cms-redis
    restart: unless-stopped
    # From build step 7 the publish queue lives here, and a lost scheduled
    # publish is a post that silently never goes out, so append-only
    # persistence is on.
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    ports:
      - '6390:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # --- The whole stack: docker compose -f infra/docker-compose.yml --profile app up --build

  # Migrations and the seed run from the api image (its @cms/db carries the
  # migrations, the seed and its content; prisma and tsx are api dependencies
  # for this). A separate migrate image cost a second deploy and ~290 MB more,
  # and the full build no longer fit a 12 GB Docker disk.
  migrate:
    image: cms-api
    pull_policy: never
    container_name: cms-migrate
    profiles: ['app']
    env_file:
      - ../.env
    environment: &datastores
      DATABASE_URL: postgresql://cms:cms@postgres:5432/cms?schema=public
      REDIS_URL: redis://redis:6379
    command: ['npm', 'run', '--silent', 'db:setup']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  publisher:
    build:
      context: ..
      dockerfile: infra/Dockerfile.publisher
    image: cms-publisher
    container_name: cms-publisher
    profiles: ['app']
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      <<: *datastores
      PUBLISHER_HEALTH_PORT: '4400'
    ports:
      - '4400:4400'
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    image: cms-api
    container_name: cms-api
    profiles: ['app']
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      <<: *datastores
      PORT: ''
      API_PORT: '4000'
      PUBLISHER_INTERNAL_URL: http://publisher:4400
    ports:
      - '4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    image: cms-web
    container_name: cms-web
    profiles: ['app']
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: '3000'
      API_BASE_URL: http://api:4000
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
