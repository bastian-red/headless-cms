name: CI

# One job per lane. Each proves something the others cannot: the unit lane
# cannot see turbo stripping the environment, the e2e lane supplies its own
# environment and so cannot see it either, only dev-smoke boots the documented
# `pnpm dev`, and only integration runs the real Nest graph against real
# Postgres and Redis at the documented rate-limit budgets.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The datastores every lane but quality and unit needs.
env:
  DATABASE_URL: postgresql://cms:cms@localhost:5444/cms?schema=public
  REDIS_URL: redis://localhost:6390

jobs:
  quality:
    name: Lint, typecheck, contracts, secrets, format, audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so gitleaks scans every commit and not just the tip.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # Self-tests first: a checker that has silently stopped checking passes
      # everything, and only a check on the checker can see that.
      - run: pnpm env:contract:self-test
      - run: pnpm env:contract
      - run: pnpm scan:invisible:self-test
      - run: pnpm scan:invisible
      - run: pnpm scan:self-import:self-test
      - run: node scripts/render-check.mjs --self-test
      - run: node scripts/wait-for-api.mjs --self-test
      - run: pnpm scan:self-import
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: pnpm run scan:secrets
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec prettier --check "**/*.{ts,tsx,js,cjs,mjs,json}"
      # Runtime dependencies only, and only critical: a critical advisory in
      # anything that ships fails the build (next <=16.4.0 had two RCEs).
      - run: pnpm audit --prod --audit-level critical

  unit:
    name: Unit and design gates (UTC and Pacific/Kiritimati)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm test
      # Twice, the second time at UTC+14: a formatter or an hour bucket that
      # assumed UTC passes the first run and fails here.
      - run: pnpm test
        env:
          TZ: Pacific/Kiritimati

  integration:
    name: Integration (schema guarantees, seed check, real Nest graph, Postgres, Redis, documented budgets)
    runs-on: ubuntu-24.04
    env:
      AUTH_SECRET: ci-secret-at-least-32-characters-long
    services:
      postgres: &postgres
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_DB: cms
        ports: ['5444:5432']
        options: >-
          --health-cmd "pg_isready -U cms -d cms"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis: &redis
        image: redis:7-alpine
        ports: ['6390:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: ./scripts/db-drift.sh
      # Seeds twice and digests both runs, then checks no canary is public.
      - run: ./scripts/seed-check.sh
      - run: ./scripts/integration.sh
      # p95 < 50 ms over 2,000 published posts, through the function /v1/search calls.
      - run: pnpm search:bench

  dev-smoke:
    # Deliberately NO job-level datastore env reaching the app: the point of
    # this job is that the only configuration reaching the processes is the
    # .env file, through scripts/dev.sh, the way it does on a reader's machine.
    # (The workflow-level env is stripped by dev-smoke.sh's `env -u`.)
    name: pnpm dev serves api, web and publisher
    runs-on: ubuntu-24.04
    services:
      postgres: *postgres
      redis: *redis
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set up .env the way the README says
        run: |
          cp .env.example .env
          sed -i "s|^AUTH_SECRET=|AUTH_SECRET=$(openssl rand -base64 32)|" .env
          sed -i "s|^CONTENT_API_KEY=.*|CONTENT_API_KEY=$(node scripts/new-api-key.mjs)|" .env
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm db:seed
      # Cold runner, nothing built: dev's ^build dependency has to do it all.
      - run: WAIT_SECONDS=300 ./scripts/dev-smoke.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dev-smoke-log
          path: /tmp/cms-dev-smoke.log
          retention-days: 7

  e2e:
    name: E2E (Playwright, Chromium + Firefox, axe in both schemes, 390 px)
    runs-on: ubuntu-24.04
    services:
      postgres: *postgres
      redis: *redis
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @cms/e2e exec playwright install --with-deps chromium firefox
      - run: ./scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7

  images:
    name: Docker images build (api, web, publisher)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, publisher]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
